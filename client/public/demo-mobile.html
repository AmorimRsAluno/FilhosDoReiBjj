<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filhos do Rei BJJ - Demo Mobile</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d0d0d;
        color: #fff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 18px;
        padding: 22px;
        background:
          linear-gradient(135deg, rgba(255, 196, 15, 0.1), transparent 24rem),
          repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 14px),
          #0d0d0d;
      }

      header {
        width: min(1180px, 100%);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand img {
        width: 56px;
        height: 56px;
        border-radius: 999px;
        border: 1px solid #ffc40f;
        object-fit: cover;
        filter: drop-shadow(0 0 18px rgba(255, 196, 15, 0.35));
      }

      .brand strong {
        display: block;
        font-size: 18px;
        line-height: 1;
      }

      .brand span {
        display: block;
        margin-top: 4px;
        color: #ffc40f;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      a {
        color: #0d0d0d;
        background: #ffc40f;
        border-radius: 8px;
        padding: 10px 14px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 800;
      }

      main {
        display: grid;
        place-items: center;
        min-height: 0;
      }

      .phone {
        position: relative;
        width: min(390px, calc(100vw - 32px));
        height: min(844px, calc(100vh - 126px));
        min-height: 620px;
        border: 12px solid #050505;
        border-radius: 46px;
        background: #050505;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.16),
          0 0 0 3px rgba(255, 196, 15, 0.18),
          0 28px 80px rgba(0, 0, 0, 0.68);
        overflow: hidden;
      }

      .notch {
        position: absolute;
        z-index: 2;
        top: 0;
        left: 50%;
        width: 132px;
        height: 27px;
        transform: translateX(-50%);
        border-radius: 0 0 18px 18px;
        background: #050505;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #0d0d0d;
      }

      @media (max-width: 560px) {
        body {
          padding: 12px;
        }

        header {
          align-items: flex-start;
          flex-direction: column;
        }

        a {
          width: 100%;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="/logo-filhos-do-rei.png" alt="" />
        <div>
          <strong>FILHOS DO REI BJJ</strong>
          <span>DEMO MOBILE</span>
        </div>
      </div>
      <a href="/?demo=login">Abrir modo web</a>
    </header>

    <main>
      <div class="phone">
        <div class="notch"></div>
        <iframe src="/?demo=login" title="Filhos do Rei BJJ"></iframe>
      </div>
    </main>
  </body>
</html>
